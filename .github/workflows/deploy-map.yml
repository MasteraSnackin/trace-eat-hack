name: Publish the Trace system map

on:
  push:
    branches: [main]
    paths:
      - docs/diagrams/trace-system.html
      - .github/workflows/deploy-map.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: trace-map-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the map
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Prepare the static map
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/trace-map-site"
          cp docs/diagrams/trace-system.html "$RUNNER_TEMP/trace-map-site/index.html"
          touch "$RUNNER_TEMP/trace-map-site/.nojekyll"
          cmp docs/diagrams/trace-system.html "$RUNNER_TEMP/trace-map-site/index.html"

      # Upload only the self-contained map, without the webcam app or API.
      - name: Upload the map
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/trace-map-site
          include-hidden-files: true

      - name: Publish to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
